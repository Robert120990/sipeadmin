  dompurify: '>=3.4.17'
  source-map-js: '>=1.2.2'
  body-parser: '>=2.4.0'
  ip-address: '>=10.7.4'
  qs: '>=6.16.1'
  'minimatch@>=7.0.0 <11.0.1': '>=11.0.1'
